
      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for project ZIP..."

          ZIP_FILE=$(find . -type f -iname "VOX_MIXER_Android_MVP.zip" -not -path "./.git/*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f -iname "*.zip" -not -path "./.git/*" -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p extracted_project
          unzip -o "$ZIP_FILE" -d extracted_project

          PROJECT_DIR=$(dirname "$(find extracted_project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Gradle project not found!"
            find extracted_project -maxdepth 5 -type f
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
